name: AuthMePAL
version: '${version}'
main: org.authmePAL.AuthMePAL
description: Securely verifies Mojang account ownership and automates AuthMe logins on offline-mode Paper servers.
authors: [hizeric]
api-version: '26.3'
load: POSTWORLD
depend: [packetevents, AuthMe]
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
commands:
  authmepal:
    description: AuthMePAL administration
    usage: /authmepal <status|exempt|link|unlink|migrate>
permissions:
  authmepal.admin:
    description: Allows administration of AuthMePAL
    default: op
